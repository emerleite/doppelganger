<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doppelganger</title>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="logo-dot"></span>
        <h1>Doppelganger</h1>
      </div>
      <div class="controls">
        <button id="pick-folder">Choose folder…</button>
        <span id="folder-label" class="folder-label muted">No folder selected</span>
        <label class="slider">
          Similarity
          <input type="range" id="threshold" min="0" max="20" value="6" />
          <span id="threshold-val">6</span>
        </label>
        <button id="scan" disabled>Scan</button>
      </div>
    </header>

    <section id="progress" class="progress hidden">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-label" id="progress-label">Preparing…</span>
    </section>

    <main id="results">
      <p class="empty">Pick a folder and click <strong>Scan</strong> to find duplicate or visually-similar photos.</p>
    </main>

    <footer id="footer" class="hidden">
      <span id="tally">No files marked.</span>
      <div class="footer-actions">
        <button id="toggle-all" class="secondary">Select all</button>
        <button id="trash-btn" disabled>Move to Trash</button>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
